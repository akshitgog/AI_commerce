[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-commerce-gateway"
version = "0.1.0"
description = "Trusted commerce application services for the Razorpay AI-buyer track."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2.0",
  "litellm>=1.99.0",
  "mcp>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
  # Cloud storage (optional - only needed if using S3 or GCS)
  "boto3>=1.35,<2",  # For AWS S3
  "google-cloud-storage>=2.18,<3",  # For Google Cloud Storage
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_commerce_gateway"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL configured with TEST_DATABASE_URL",
  "provider: requires Razorpay Test Mode credentials",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E402", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_commerce_gateway"]


[[tool.mypy.overrides]]
module = ['boto3.*', 'botocore.*', 'google.cloud.*']
ignore_missing_imports = true

