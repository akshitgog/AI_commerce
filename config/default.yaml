app:
  environment: development
  name: AI Commerce Gateway
  log_level: INFO

database:
  url: sqlite:///commerce_dev.db
  test_url: null
  pool_size: 5
  max_overflow: 10
  pool_timeout_seconds: 30

llm:
  provider: openai
  model: gpt-5.4-mini
  api_key: null
  base_url: null
  temperature: 0.2
  # Hard bound on the buyer AI tool-result loop turns per chat request.
  max_tool_steps: 8

storage:
  provider: unconfigured
  bucket: product-images
  public_base_url: null

razorpay:
  key_id: null
  key_secret: null
  webhook_secret: null
  api_base_url: https://api.razorpay.com
  timeout_seconds: 10.0
  checkout_name: AI Commerce Gateway

buyer_services:
  # in_process: compose the real merchant/transaction application services
  # inside one process (the integrated deployment).
  # remote: call separately deployed trusted services over HTTP.
  mode: in_process
  catalog_base_url: null
  transaction_base_url: null
  timeout_seconds: 10.0

buyer_sessions:
  # HMAC secret for buyer session tokens. Without it the gateway is
  # fail-closed: no buyer endpoint can authenticate.
  secret: null
  # Key required by POST /v1/buyer/sessions to mint buyer sessions. In a real
  # deployment the identity provider/backoffice holds this; without it session
  # issuance is disabled.
  issuer_key: null
  ttl_seconds: 3600

merchant_mcp:
  # Base URL of the trusted merchant catalog service. When set, the gateway
  # mounts the merchant MCP adapter at /mcp/merchant; when null, the merchant
  # MCP surface is not exposed at all.
  api_base_url: null
  timeout_seconds: 10.0
  publication_secret: null
  publication_audience: merchant-mcp-publication
  confirmation_ttl_seconds: 300
