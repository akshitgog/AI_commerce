services:
  - type: web
    name: ai-commerce-backend
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn ai_commerce_gateway.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: BUYER_SESSIONS_SECRET
        generateValue: true
      - key: BUYER_SESSIONS_ISSUER_KEY
        generateValue: true
      - key: STORAGE_PROVIDER
        value: unconfigured
      - key: STORAGE_BUCKET
        value: product-images
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
