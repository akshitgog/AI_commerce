services:
  - type: web
    name: ai-commerce-backend
    env: python
    buildCommand: "uv pip install -r pyproject.toml" # Or pip install if exported
    startCommand: "uvicorn src.ai_commerce_gateway.api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false # User will provide this from Neon/Supabase
      - key: FIREWORKS_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: BUYER_SESSIONS_SECRET
        generateValue: true
      - key: BUYER_SESSIONS_ISSUER_KEY
        generateValue: true
      # Storage Configuration
      - key: STORAGE_PROVIDER
        value: local  # local, s3, gcs, or unconfigured
      - key: STORAGE_BUCKET
        value: product-images
      # AWS S3 (optional - only if STORAGE_PROVIDER=s3)
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # GCP (optional - only if STORAGE_PROVIDER=gcs)
      - key: GCP_CREDENTIALS_JSON
        sync: false
      # Supabase (optional - only if STORAGE_PROVIDER=supabase)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

