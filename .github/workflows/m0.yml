name: M0 foundation

on:
  pull_request:
  push:
    branches:
      - main
      - foundation/m0-freeze

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ai_commerce_gateway_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_commerce_gateway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_commerce_gateway_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_commerce_gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=ai_commerce_gateway --cov-fail-under=90
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
